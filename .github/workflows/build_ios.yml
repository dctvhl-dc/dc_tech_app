name: Build iOS Release App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter precache --ios

      - name: Build iOS App & Run CocoaPods
        run: |
          flutter build ios --release --no-codesign

      - name: Package App into IPA File
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          rm -f DC_TECH_Rental.ipa
          zip -r DC_TECH_Rental.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DC_TECH_Rental_iOS_IPA
          path: build/ios/iphoneos/DC_TECH_Rental.ipa
